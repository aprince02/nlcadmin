name: DB Backup

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for backup"
        required: false
        default: "manual"
  schedule:
    - cron: "0 2 * * *"

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Set backup filename
        id: vars
        run: |
          TS=$(date +'%Y-%m-%d_%H-%M-%S')
          REASON="${{ github.event.inputs.reason }}"
          if [ -z "$REASON" ]; then REASON="scheduled"; fi
          echo "filename=backup_${TS}_${REASON}.dump" >> $GITHUB_OUTPUT

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump -Fc "$DATABASE_URL" -f "${{ steps.vars.outputs.filename }}"

      - name: Confirm backup file exists
        run: |
          ls -lh "${{ steps.vars.outputs.filename }}"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.filename }}
          path: ${{ steps.vars.outputs.filename }}
          retention-days: 90
          if-no-files-found: error
