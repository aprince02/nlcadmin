name: DB Backup

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual backup"
        required: false
        default: "manual"

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Set backup filename
        id: vars
        run: |
          TS=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "filename=backup_${TS}_${{ github.event.inputs.reason || 'scheduled' }}.dump" >> $GITHUB_OUTPUT

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pg_dump -Fc "$DATABASE_URL" -f "${{ steps.vars.outputs.filename }}"

      - name: Confirm backup file exists
        run: ls -lh "${{ steps.vars.outputs.filename }}"
